services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: recipe
      POSTGRES_PASSWORD: recipe
      POSTGRES_DB: recipe
    ports: ["127.0.0.1:54329:5432"]
    volumes: ["recipe-postgres:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U recipe"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  recipe-postgres:
